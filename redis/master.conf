# ---------- Redis master ----------
bind 0.0.0.0
protected-mode no
port 6379
dir /data

# Персистентность: RDB-снапшоты + AOF
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Память и вытеснение: вытесняются только ключи с TTL (кеш, счётчики)
maxmemory 256mb
maxmemory-policy volatile-lru

# Защита от split-brain: без хотя бы одной живой реплики (лаг <= 10 сек) мастер не принимает записи
min-replicas-to-write 1
min-replicas-max-lag 10

# Имя, под которым узел представится мастеру, если после failover станет репликой
replica-announce-ip redis-master
